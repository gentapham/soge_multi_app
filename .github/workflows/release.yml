name: Phát hành bản app mới

# Mỗi khi code của app thay đổi trên nhánh main: tự build, ký số bản cập nhật
# và phát hành lên GitHub Releases. App trên máy người dùng sẽ tự thấy bản mới.
# (Thay đổi danh mục phần mềm không cần phát hành lại app.)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Đặt số phiên bản tự tăng (0.2.<lần chạy>)
        shell: bash
        run: |
          VERSION="0.2.${{ github.run_number }}"
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          echo "Phiên bản: $VERSION"
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'SOGE Multi App v__VERSION__'
          releaseBody: |
            Tải file **SOGE.Multi.App_..._x64-setup.exe** bên dưới để cài đặt.
            Máy đã cài SOGE Multi App sẽ tự hiện thông báo cập nhật khi mở app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
